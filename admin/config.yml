# The Palaver Tree, editor configuration

backend:
  name: github
  repo: kdesar-coder/palaver-tree
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "content"
    label: "The Palaver Tree"
    files:
      - name: "pieces"
        label: "All pieces"
        file: "content/pieces.json"
        description: "Every poem, story, think piece, and article lives in this one list."
        fields:
          - name: "pieces"
            label: "Pieces"
            label_singular: "Piece"
            widget: "list"
            summary: "{{fields.title}} ({{fields.dept}})"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
                required: false
              - label: "Cover image"
                name: "image"
                widget: "image"
                required: false
                hint: "Shown at the top of the piece and in the gallery. A landscape photo usually looks best."
              - label: "Image caption"
                name: "caption"
                widget: "string"
                required: false
              - label: "Department"
                name: "dept"
                widget: "select"
                options:
                  - { label: "Poems", value: "poems" }
                  - { label: "Short Stories", value: "stories" }
                  - { label: "Think Pieces", value: "think" }
                  - { label: "In Plain Words", value: "plain" }
              - label: "Date"
                name: "date"
                widget: "datetime"
                type: date
              - label: "Tags"
                name: "tags"
                widget: "list"
                required: false
              - label: "The piece"
                name: "body"
                widget: "text"
                hint: "Leave a blank line between paragraphs or stanzas. Single line breaks are kept."
