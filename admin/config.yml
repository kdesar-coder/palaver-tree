# The Palaver Tree, editor configuration
# After you create your GitHub repository, change the line below
# from YOUR-USERNAME/YOUR-REPO to your own, for example  kobbyduncan/palaver-tree

backend:
  name: github
  repo: kobbyduncan/palaver-tree
  branch: main

# Where uploaded images would go, if you add any later
media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "content"
    label: "The Palaver Tree"
    files:
      - name: "pieces"
        label: "All pieces"
        file: "content/pieces.json"
        description: "Every poem, story, think piece, and article lives in this one list."
        fields:
          - name: "pieces"
            label: "Pieces"
            label_singular: "Piece"
            widget: "list"
            summary: "{{fields.title}}  ({{fields.dept}})"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "subtitle", label: "Subtitle", widget: "string", required: false }
              - name: "dept"
                label: "Department"
                widget: "select"
                options:
                  - { label: "Poems", value: "poems" }
                  - { label: "Short Stories", value: "stories" }
                  - { label: "Think Pieces", value: "think" }
                  - { label: "In Plain Words", value: "plain" }
             - { name: "date", label: "Date", widget: "datetime", type: date, format: "YYYY-MM-DD" }
              - { name: "tags", label: "Tags", widget: "list", required: false }
              - name: "body"
                label: "The piece"
                widget: "text"
                hint: "Leave a blank line between paragraphs or stanzas. Single line breaks are kept."
